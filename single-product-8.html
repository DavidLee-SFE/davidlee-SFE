<!DOCTYPE html>
<html lang="en" data-theme="dark">


<head>
	<meta charset="UTF-8">
	<title>Single Product - 8</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="format-detection" content="telephone=no">
	<meta name="apple-mobile-web-app-capable" content="yes">

	<link rel='stylesheet' href='http://fonts.googleapis.com/css?family=Poppins:400,700%7CNeuton:400,700' type='text/css' media='all' />

	<link rel="stylesheet" type="text/css" href="css/libs/font-awesome.min.css">
	<link rel="stylesheet" type="text/css" href="css/libs/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="css/libs/justifiedGallery.min.css">
	<link rel="stylesheet" type="text/css" href="css/libs/magnific-popup.css">
	<link rel="stylesheet" type="text/css" href="css/libs/owl.carousel.min.css">
	<script src="js/theme.js"></script>
	<link rel="stylesheet" type="text/css" href="css/styles.css">
	<style>
		.single-product-8-gallery {
			display: flex;
			flex-direction: column;
			gap: 30px;
			align-items: center;
			width: 100%;
			max-width: 900px;
			margin: 0 auto;
		}
		.single-product-8-gallery .video-item {
			width: 100%;
		}
		.single-product-8-gallery .video-item video {
			display: block;
			width: 100%;
			height: auto;
			background: #000;
			border-radius: 8px;
			box-shadow: 0 12px 26px rgba(0, 0, 0, 0.18);
			object-fit: cover;
		}
		.single-product-8-gallery .portrait-pair {
			display: flex;
			width: 100%;
			gap: 30px;
		}
		.single-product-8-gallery .portrait-pair .video-item {
			flex: 1 1 0;
		}
		.single-product-8-title {
			margin-bottom: 30px;
			text-align: center;
		}
		@media (max-width: 575px) {
			.single-product-8-gallery,
			.single-product-8-gallery .portrait-pair {
				gap: 20px;
			}
		}
	</style>
</head>

<body >

	<!-- Preload -->
	<div id="preload">
		<div class="kd-bounce">
			<div></div>
			<div></div>
		</div>
	</div>
	<!-- Preload -->

	<!-- Wrapper Site -->
	<div id="main-content">

		<!-- Header -->
		<header id="header" class="header">
			<div class="container">
				<div class="header-inner">
					<div class="logo-wrap">
						<div class="logo">
							<a href="index.html">
								<h2 style="margin-top:5px;">David Lee</h2>
							</a>
						</div>
					</div>
					<div class="wrap-menu">

						<!-- Mobile -->
						<div class="menu-mobile">
							<span class="item item-1"></span>
							<span class="item item-2"></span>
							<span class="item item-3"></span>
						</div>
						<!-- End Mobile -->

						<!-- Main Menu -->
						<div class="main-menu">

							<!-- Logo Mobile -->
							<div class="logo">
								<a href="index.html">
									<h1>David Lee</h1>
								</a>
							</div>
							<!-- End Logo Mobile -->

							<!-- Btn Close -->
							<div class="btn-close">
								<i class="fa fa-times" title="Close"></i>
							</div>

							<!-- End Btn Close -->
						</div>
						<!-- End Main Menu -->
					</div>
					<button type="button" class="btn theme-toggle" id="theme-toggle" aria-pressed="true" aria-label="Switch to light color scheme">
						<i class="fa fa-sun-o" aria-hidden="true"></i>
						<span>Light mode</span>
					</button>
				</div>
			</div>
		</header>
		<div class="cover"></div>
		<div class="header-hide"></div>
		<!-- End Header -->

		<!-- Thumbnail -->
		<div class="post-thumbnail image" style="background-image: url('images/portfolio/video.png')">
			<div class="post-thumbnail-inner">
				<div class="post-thumbnail-box">
					<h2 class="title">Video Production &amp; Editing</h2>
				</div>
			</div>
		</div>
		<!-- End Thumbnail -->

		<!-- Single Project -->
		<div class="project-detail">
			<div class="container">
				<div class="row">
					<div class="col-xs-12">
						<div class="detail-content single-product-8-title">
							<h4>AI -Video Production &amp; Editing</h4>
						</div>
						<div class="images-project">
							<div class="images-wrap single-product-8-gallery">
								<div class="video-item">
									<video src="images/portfolio/video_1.mp4" muted loop playsinline controls></video>
								</div>
								<div class="video-item">
									<video src="images/portfolio/video_2.mp4" muted loop playsinline controls></video>
								</div>
								<div class="portrait-pair">
									<div class="video-item">
										<video src="images/portfolio/video_3.mp4" muted loop playsinline controls></video>
									</div>
									<div class="video-item">
										<video src="images/portfolio/video_4.mp4" muted loop playsinline controls></video>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>
		<!-- End Single Project -->
		
		<!-- End Related Projects -->

		<footer id="footer" class="footer">
			<div class="footer-inner">
				<!-- Copyright -->
				<div class="copyright">
					© <span id="year"></span>  Designed and developed by <a href="./index.html">David Lee</a>
				</div>
				<!-- End Copyright -->
			</div>
		</footer>

	</div>
	<!-- End Wrapper Site -->

	 <script>
		const d = new Date();
		document.getElementById("year").innerHTML = d.getFullYear(); 
	 </script>

	<script src="js/libs/masonry.pkgd.js"></script>
	<script src="js/libs/owl.carousel.js"></script>
	<script src="js/libs/isotope.pkgd.min.js"></script>
	<script src="js/libs/jquery.nav.js"></script>
	<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDoIZPT7FOk4dFuAI2n1fu1EYxN92UDrkk"></script>
	<script src="js/scripts.js"></script>
	<!-- End Scripts -->

</html>
